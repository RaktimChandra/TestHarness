name: log-tail
description: >-
  Re-emits the last lines of a log file as an error annotation so a failure's cause is
  visible through the checks API (useful where raw job logs cannot be downloaded).
inputs:
  file:
    description: Log file to summarise
    required: true
  lines:
    description: Number of trailing lines to include
    default: '80'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        f='${{ inputs.file }}'
        [ -f "$f" ] || { echo "no log at $f"; exit 0; }
        # Maven error lines first (they name the failing test and assertion), then other
        # failure markers, then the plain tail. Repeated warnings must not crowd them out.
        body=$( { grep -E '^\[ERROR\]|BUILD FAILURE' "$f" | grep -v '^\[ERROR\] *$' | head -40; \
                  echo '--- other failure markers ---'; grep -E 'FAILED|Tests run:.*Fail|^Caused by' "$f" | sort | uniq -c | sort -rn | head -15; \
                  echo '--- tail ---'; tail -n ${{ inputs.lines }} "$f"; } \
          | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-60000)
        echo "::error title=log tail ($f)::${body}"
