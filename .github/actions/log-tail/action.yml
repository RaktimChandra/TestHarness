name: log-tail
description: >-
  Re-emits the last lines of a log file as an error annotation so a failure's cause is
  visible through the checks API (useful where raw job logs cannot be downloaded).
inputs:
  file:
    description: Log file to summarise
    required: true
  lines:
    description: Number of trailing lines to include
    default: '80'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        f='${{ inputs.file }}'
        [ -f "$f" ] || { echo "no log at $f"; exit 0; }
        # Prefer Maven error lines; fall back to the plain tail.
        body=$( { grep -E '^\[ERROR\]|FAILED|Tests run:.*Fail|BUILD FAILURE|Exception' "$f" | head -60; echo '--- tail ---'; tail -n ${{ inputs.lines }} "$f"; } \
          | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}' | cut -c1-60000)
        echo "::error title=log tail ($f)::${body}"
