# The AI drafter against real models: Ollama on the runner serves small open models through
# its OpenAI-compatible API, tools/ai_eval.py drafts a feature for every story in
# experiments/ai/stories (twice) and scores the drafts against the BDD suite's real step
# definitions. One runner per model and prompt variant: "catalogue" (the suite's step
# definitions in the prompt, th ai gherkin's default) and "phrases" (only phrases of existing
# features). Optionally a hosted model through the Anthropic API, if the repository has an
# ANTHROPIC_API_KEY secret. Results are pushed to the branch ai-eval/<run id>.
name: ai-eval

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Drafts per story per model
        default: '2'
      models:
        description: Open models to evaluate (JSON list)
        default: '["qwen2.5:1.5b", "llama3.2:3b", "qwen2.5:7b", "qwen2.5:14b"]'
      variants:
        description: Prompt variants (JSON list of catalogue, phrases)
        default: '["catalogue", "phrases"]'
      hosted_model:
        description: Also evaluate this Anthropic model (needs the ANTHROPIC_API_KEY secret); empty to skip
        default: ''

permissions:
  contents: read

env:
  HARNESS_ENV: ci
  GATE_SEED_PASSWORD: ai-${{ github.run_id }}

jobs:
  model:
    name: ${{ matrix.model }} (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models || '["qwen2.5:1.5b", "llama3.2:3b", "qwen2.5:7b", "qwen2.5:14b"]') }}
        variant: ${{ fromJSON(inputs.variants || '["catalogue", "phrases"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ollama with ${{ matrix.model }}
        # The Ollama server image (a pinned release) rather than the install script: the first
        # run of this workflow failed inside install.sh, and a container gives the same server
        # on any runner with no system changes.
        run: |
          set -o pipefail
          {
            docker run -d --name ollama -p 11434:11434 ollama/ollama:0.9.0
            for i in $(seq 1 60); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
            curl -sf http://localhost:11434/api/version
            docker exec ollama ollama pull '${{ matrix.model }}'
            docker exec ollama ollama list
          } 2>&1 | tee "$RUNNER_TEMP/ollama.log"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/ollama.log
      - name: Build
        run: ./mvnw -B -ntp -q install -DskipTests
      - name: Draft and score
        # pipefail: the first run's qwen2.5:7b job ended "success" without a summary, because tee
        # hid the evaluator's exit code.
        run: |
          set -o pipefail
          mkdir -p out
          # the failure explanation depends on the model, not the drafting prompt: once per model
          EXPLAIN=$([ '${{ matrix.variant }}' = catalogue ] && echo --explain || true)
          python3 tools/ai_eval.py --model '${{ matrix.model }}' --variant '${{ matrix.variant }}' \
            --repeats ${{ inputs.repeats || '2' }} --out out $EXPLAIN 2>&1 | tee out/console-${{ strategy.job-index }}.txt
          echo "::notice title=ai-eval ${{ matrix.model }} ${{ matrix.variant }}::$(python3 -c "import json,glob;print(json.dumps(json.load(open(glob.glob('out/*/ai-eval.json')[0]))['summary']))")"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: out/console-${{ strategy.job-index }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-eval-${{ strategy.job-index }}
          path: out

  hosted:
    name: ${{ inputs.hosted_model }} (Anthropic API)
    if: inputs.hosted_model != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants || '["catalogue", "phrases"]') }}
    env:
      HARNESS_AI_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: The key is configured
        run: '[ -n "$HARNESS_AI_API_KEY" ] || { echo "::error::hosted_model needs the ANTHROPIC_API_KEY repository secret"; exit 1; }'
      - name: Build
        run: ./mvnw -B -ntp -q install -DskipTests
      - name: Draft and score
        run: |
          set -o pipefail
          mkdir -p out
          EXPLAIN=$([ '${{ matrix.variant }}' = catalogue ] && echo --explain || true)
          python3 tools/ai_eval.py --provider anthropic --model '${{ inputs.hosted_model }}' --variant '${{ matrix.variant }}' \
            --repeats ${{ inputs.repeats || '2' }} --timeout 5m --out out $EXPLAIN 2>&1 | tee out/console-hosted-${{ strategy.job-index }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-eval-hosted-${{ strategy.job-index }}
          path: out

  results:
    name: Push results
    needs: [model, hosted]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ai-eval-*
          path: experiments/ai/results
          merge-multiple: true
      - name: Summarise
        run: python3 tools/ai_eval_report.py experiments/ai/results | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push
        if: hashFiles('experiments/ai/results/**/ai-eval.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -o pipefail
          {
            git checkout -b "ai-eval/${{ github.run_id }}"
            git add -f experiments/ai/results
            git status --short | head -20
            git commit -q -m "experiment: AI drafter evaluation from run ${{ github.run_id }}"
            git push origin "ai-eval/${{ github.run_id }}"
          } 2>&1 | tee "$RUNNER_TEMP/push.log"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/push.log
