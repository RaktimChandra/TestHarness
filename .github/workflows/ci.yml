name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARNESS_ENV: ci
  MVN: ./mvnw -B -ntp --fail-at-end

jobs:
  build:
    name: Build + framework & SUT tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests, SUT integration tests, framework tests (incl. real Chrome)
        run: |
          set -o pipefail
          $MVN install -pl '!suites/api-suite,!suites/ui-suite,!suites/bdd-suite' 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "build" "sut/**/TEST-*.xml" "harness/**/TEST-*.xml"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-build
          path: target/allure-results
          if-no-files-found: ignore

  suite:
    name: ${{ matrix.suite }} suite (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: api, browser: none}
          - {suite: bdd, browser: chrome}
          - {suite: ui, browser: chrome}
          - {suite: ui, browser: firefox}
          - {suite: ui, browser: edge}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build upstream modules
        run: $MVN install -DskipTests -pl suites/${{ matrix.suite }}-suite -am
      - name: Run ${{ matrix.suite }} suite
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }}
          $MVN verify -pl suites/${{ matrix.suite }}-suite \
            -Dharness.ui.browser=${BROWSER/none/chrome} \
            -Djunit.jupiter.execution.parallel.config.fixed.parallelism=4 \
            -Djunit.jupiter.execution.parallel.config.fixed.max-pool-size=4 \
            2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "${{ matrix.suite }}-${{ matrix.browser }}" "suites/${{ matrix.suite }}-suite/**/TEST-*.xml"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.suite }}-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidence-${{ matrix.suite }}-${{ matrix.browser }}
          path: suites/*/target/evidence
          if-no-files-found: ignore

  compose-smoke:
    name: Docker Compose SUT + API suite (external mode)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_ENV: docker
      GATE_TEST_SUPPORT_KEY: ${{ github.run_id }}-compose-key
      GATE_JWT_SECRET: ${{ github.run_id }}-compose-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the SUT with Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Build upstream modules
        run: $MVN install -DskipTests -pl suites/api-suite -am
      - name: API suite against the container
        run: |
          set -o pipefail
          $MVN verify -pl suites/api-suite 2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "compose-api" "suites/api-suite/**/TEST-*.xml"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/compose.log" 2>&1 || true
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/suite.log
      - name: Stop
        if: always()
        run: docker compose down -v

  report:
    name: Allure report
    needs: [build, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true
      - name: Generate report
        run: ./mvnw -B -ntp -N -Preport verify
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
