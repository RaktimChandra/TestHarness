name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HARNESS_ENV: ci
  MVN: ./mvnw -B -ntp --fail-at-end
  # In CI no secret may fall back to a dev default (see DESIGN.md D8). The seeded users'
  # password is generated per run unless the repository defines a secret.
  GATE_SEED_PASSWORD: ${{ secrets.GATE_SEED_PASSWORD || format('ci-{0}-{1}', github.run_id, github.run_attempt) }}

jobs:
  build:
    name: Build + framework & SUT tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, unit tests, SUT integration tests, framework tests (incl. real Chrome)
        run: |
          set -o pipefail
          $MVN install -pl '!suites/api-suite,!suites/ui-suite,!suites/bdd-suite,!suites/perf-suite' 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Consumer contract is up to date
        run: |
          # gate-ui's Pact tests regenerate contracts/pacts during the build; gate-api has just
          # verified that file. A diff means the committed contract no longer matches the UI.
          git diff --exit-code -- contracts/ || { echo "::error title=contract drift::contracts/ changed - commit the regenerated pact"; exit 1; }
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "build" "sut/**/TEST-*.xml" "harness/**/TEST-*.xml"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-build
          path: target/allure-results
          if-no-files-found: ignore

  suite:
    name: ${{ matrix.suite }} suite (${{ matrix.browser }}, shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The UI suite is split in two per browser by a stable hash of each test's key
          # (harness.shard, ShardFilter): six UI jobs, each running about half the tests.
          - {suite: api, browser: none, shard: '1/1', tag: 1of1}
          - {suite: bdd, browser: chrome, shard: '1/1', tag: 1of1}
          - {suite: ui, browser: chrome, shard: '1/2', tag: 1of2}
          - {suite: ui, browser: chrome, shard: '2/2', tag: 2of2}
          - {suite: ui, browser: firefox, shard: '1/2', tag: 1of2}
          - {suite: ui, browser: firefox, shard: '2/2', tag: 2of2}
          - {suite: ui, browser: edge, shard: '1/2', tag: 1of2}
          - {suite: ui, browser: edge, shard: '2/2', tag: 2of2}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build upstream modules
        run: $MVN install -DskipTests -pl suites/${{ matrix.suite }}-suite -am
      - name: Run ${{ matrix.suite }} suite
        run: |
          set -o pipefail
          BROWSER=${{ matrix.browser }}
          $MVN verify -pl suites/${{ matrix.suite }}-suite \
            -Dharness.ui.browser=${BROWSER/none/chrome} \
            -Dharness.visual.platform=${BROWSER/none/chrome}-ci \
            -Djunit.jupiter.execution.parallel.config.fixed.parallelism=4 \
            -Djunit.jupiter.execution.parallel.config.fixed.max-pool-size=4 \
            -Dharness.shard=${{ matrix.shard }} \
            -Dharness.quarantine.mode=exclude \
            2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "${{ matrix.suite }}-${{ matrix.browser }}-${{ matrix.tag }}" "suites/${{ matrix.suite }}-suite/**/TEST-*.xml"
      - name: Accessibility summary
        if: always() && matrix.suite == 'ui'
        run: python3 .github/scripts/a11y_summary.py "${{ matrix.browser }}" "suites/ui-suite/target/a11y/*.json"
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.suite == 'ui'
        with:
          name: visual-${{ matrix.browser }}-${{ matrix.tag }}
          path: suites/ui-suite/target/visual
          if-no-files-found: ignore
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.suite }}-${{ matrix.browser }}-${{ matrix.tag }}
          path: target/allure-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidence-${{ matrix.suite }}-${{ matrix.browser }}-${{ matrix.tag }}
          path: suites/*/target/evidence
          if-no-files-found: ignore

  compose-smoke:
    name: Docker Compose SUT + API suite (external mode)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARNESS_ENV: docker
      GATE_TEST_SUPPORT_KEY: ${{ github.run_id }}-compose-key
      GATE_JWT_SECRET: ${{ github.run_id }}-compose-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the SUT with Docker Compose
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee "$RUNNER_TEMP/compose.log"
      - name: Build upstream modules
        run: $MVN install -DskipTests -pl suites/api-suite -am
      - name: API suite against the container
        run: |
          set -o pipefail
          $MVN verify -pl suites/api-suite 2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "compose-api" "suites/api-suite/**/TEST-*.xml"
      - name: Container logs on failure
        if: failure()
        run: |
          docker compose ps -a >> "$RUNNER_TEMP/compose.log" 2>&1 || true
          docker compose logs --no-color --tail 120 >> "$RUNNER_TEMP/compose.log" 2>&1 || true
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/compose.log
          lines: '150'
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/suite.log
      - name: Stop
        if: always()
        run: docker compose down -v

  perf:
    name: Gatling performance smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build upstream modules
        run: $MVN install -DskipTests -DskipPerf -pl suites/perf-suite -am
      - name: Booking flow under load (gates p95/p99/error rate)
        run: |
          set -o pipefail
          $MVN verify -pl suites/perf-suite 2>&1 | tee "$RUNNER_TEMP/perf.log"
      - name: Gatling summary
        if: always()
        run: python3 .github/scripts/gatling_summary.py "perf" "$RUNNER_TEMP/perf.log"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/perf.log

  dashboard:
    name: Quality dashboard - tests, typecheck, committed build is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: The page committed into harness-insights matches its source
        run: git diff --exit-code -- ../harness/harness-insights/src/main/resources/io/github/raktimchandra/testharness/insights/dashboard/site/index.html

  teamcity-dsl:
    name: TeamCity Kotlin DSL compiles and generates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The Kotlin DSL library is served by a TeamCity server (it includes classes generated
      # from the server's plugins), so start a throwaway server just to resolve it.
      - name: Start a throwaway TeamCity server (DSL library repository only)
        run: |
          docker run -d --name teamcity -p 8111:8111 \
            -e TEAMCITY_SERVER_OPTS="-Dteamcity.startup.maintenance=false -Dteamcity.licenseAgreement.accepted=true" \
            jetbrains/teamcity-server:2025.07
          # Ready once the web app answers (401 = up, authentication required).
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8111/ || true)
            if [ "$code" = 401 ] || [ "$code" = 200 ]; then echo "server up after $((i*5)) s"; break; fi
            sleep 5
          done
          for a in configs-dsl-kotlin-latest configs-dsl-kotlin-plugins-latest; do
            curl -s -o /dev/null -w "$a pom: %{http_code}\n" \
              "http://localhost:8111/app/dsl-plugins-repository/org/jetbrains/teamcity/$a/1.0-SNAPSHOT/$a-1.0-SNAPSHOT.pom" \
              | tee -a "$RUNNER_TEMP/teamcity.log"
          done
      - name: Compile .teamcity/settings.kts and generate the project configuration
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .teamcity/pom.xml teamcity-configs:generate 2>&1 | tee -a "$RUNNER_TEMP/teamcity.log"
          echo "### TeamCity DSL" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated $(find .teamcity/target/generated-configs -type f | wc -l) files; build types:" >> "$GITHUB_STEP_SUMMARY"
          find .teamcity/target/generated-configs -name '*.kts' -o -name '*.xml' | sed 's/^/- /' | head -40 >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/teamcity.log
      - uses: actions/upload-artifact@v4
        with:
          name: teamcity-generated-configs
          path: .teamcity/target/generated-configs
          if-no-files-found: error

  mutation:
    name: Mutation testing (PIT) - domain rules
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: PIT on sut/gate-domain (fails below the 95 % threshold)
        run: $MVN -Pmutation verify -pl sut/gate-domain
      - name: Mutation summary
        if: always()
        run: python3 .github/scripts/pit_summary.py sut/gate-domain/target/pit-reports/mutations.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-report
          path: sut/gate-domain/target/pit-reports
          if-no-files-found: ignore

  grid:
    name: Selenium Grid - UI suite at 1/4/8 workers + cross-browser
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HARNESS_ENV: docker
      GRID_SESSIONS: '8'
      GATE_TEST_SUPPORT_KEY: ${{ github.run_id }}-grid-key
      GATE_JWT_SECRET: ${{ github.run_id }}-grid-jwt-secret-0123456789abcdef
      GRID: -Dharness.ui.grid-url=http://localhost:4444 -Dharness.sut.browser-base-url=http://gate:8080 -DexcludedGroups=visual
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start SUT + Selenium Grid (hub, Chrome, Firefox, Edge)
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.grid.yml up -d --build --wait --wait-timeout 400 2>&1 | tee "$RUNNER_TEMP/compose.log"
      - name: Build upstream modules
        run: $MVN install -DskipTests -pl suites/ui-suite -am
      - name: UI suite on Grid (Chrome) at 1, 4 and 8 workers
        run: |
          set -o pipefail
          TS="-Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS"
          : > "$RUNNER_TEMP/timings.txt"
          echo "runner: $(nproc) vCPU, $(free -g | awk '/Mem:/{print $2}') GiB" | tee -a "$RUNNER_TEMP/timings.txt"
          for rep in 1 2; do
            for w in 1 4 8; do
              log="$RUNNER_TEMP/grid-chrome-w$w-r$rep.log"
              start=$(date +%s.%N)
              $MVN verify -pl suites/ui-suite $GRID $TS -Dharness.ui.browser=chrome \
                -Djunit.jupiter.execution.parallel.config.fixed.parallelism=$w \
                -Djunit.jupiter.execution.parallel.config.fixed.max-pool-size=$w 2>&1 | tee "$log" >> "$RUNNER_TEMP/grid.log"
              wall=$(python3 -c "import time;print(f'{time.time()-$start:.1f}')")
              span=$(python3 .github/scripts/test_span.py "$log")
              sum=$(python3 -c "import glob,xml.etree.ElementTree as E;print(f\"{sum(float(t.get('time') or 0) for f in glob.glob('suites/ui-suite/target/surefire-reports/TEST-*.xml') for t in E.parse(f).getroot().iter('testcase')):.1f}\")")
              tests=$(python3 -c "import glob,xml.etree.ElementTree as E;print(sum(1 for f in glob.glob('suites/ui-suite/target/surefire-reports/TEST-*.xml') for _ in E.parse(f).getroot().iter('testcase')))")
              echo "rep=$rep workers=$w tests=$tests maven_wall_s=$wall test_span_s=$span sum_test_time_s=$sum" | tee -a "$RUNNER_TEMP/timings.txt"
            done
          done
          { echo '### Grid timings (Chrome)'; echo '```'; cat "$RUNNER_TEMP/timings.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=grid timings (chrome)::$(tr '\n' ' ' < "$RUNNER_TEMP/timings.txt")"
      - name: Cross-browser on Grid (Firefox, Edge) at 4 workers
        run: |
          set -o pipefail
          for b in firefox edge; do
            $MVN verify -pl suites/ui-suite $GRID -Dharness.ui.browser=$b \
              -Djunit.jupiter.execution.parallel.config.fixed.parallelism=4 \
              -Djunit.jupiter.execution.parallel.config.fixed.max-pool-size=4 2>&1 | tee -a "$RUNNER_TEMP/grid.log"
            python3 .github/scripts/test_summary.py "grid-$b" "suites/ui-suite/**/TEST-*.xml"
          done
      - name: Container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.grid.yml logs --no-color --tail 80 >> "$RUNNER_TEMP/compose.log" 2>&1 || true
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/grid.log
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/compose.log
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.grid.yml down -v

  quarantined:
    name: Quarantined tests (non-blocking)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs only what quarantine.json lists. Its failures are reported in the summary and the
    # Allure report, and never fail the pipeline: that is what quarantine means here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build upstream modules
        run: $MVN install -DskipTests -pl suites/flaky-demo -am
      - name: Run the quarantined tests
        run: $MVN verify -pl suites/flaky-demo -DskipFlakyDemo=false -Dharness.quarantine.mode=only
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py "quarantined" "suites/flaky-demo/**/TEST-*.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-quarantined
          path: target/allure-results
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    needs: [build, dashboard, suite, compose-smoke, perf, mutation, grid, teamcity-dsl, quarantined]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Every blocking job passed; quarantined results are reported only
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/quality_gate.py

  report:
    name: Allure report
    needs: [build, suite, quarantined]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true
      - name: Generate report
        run: ./mvnw -B -ntp -N -Preport verify
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
