# Capacity experiment (tools/capacity.py): the SUT in Docker Compose limited to 2 CPUs / 1 GiB,
# arrival rate stepped up until it stops keeping up. Two flows (sign in every time vs. token
# reused) x three independent runners, so the spread between runners is measured too.
# Results are pushed to the branch capacity/<run id> for review.
name: capacity

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per level
        default: '60'

permissions:
  contents: read

env:
  HARNESS_ENV: docker
  GATE_TEST_SUPPORT_KEY: cap-${{ github.run_id }}-key
  GATE_JWT_SECRET: cap-${{ github.run_id }}-jwt-secret-0123456789abcdef
  GATE_SEED_PASSWORD: cap-${{ github.run_id }}

jobs:
  level-sweep:
    name: ${{ matrix.flow }} flow, runner ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flow: [full, authenticated]
        rep: [1, 2, 3]
        include:
          - {flow: full, rates: '5,10,15,20,25,30,40,50,60'}
          - {flow: authenticated, rates: '10,20,40,60,80,100,120,160,200,240'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the perf suite
        run: ./mvnw -B -ntp -q install -DskipTests -DskipPerf -pl suites/perf-suite -am
      - name: Start the SUT with fixed resources
        run: docker compose -f docker-compose.yml -f docker-compose.capacity.yml up -d --build --wait --wait-timeout 300
      - name: Step the arrival rate
        run: |
          python3 tools/capacity.py --flow ${{ matrix.flow }} --rates '${{ matrix.rates }}' \
            --duration ${{ inputs.duration || '60' }} --mvn "./mvnw -B -ntp" \
            --label "${{ github.run_id }}-r${{ matrix.rep }}" --out out | tee out-console.txt
          echo "::notice title=capacity ${{ matrix.flow }} r${{ matrix.rep }}::$(tail -1 out-console.txt) | $(grep ' @ ' out-console.txt | tr '\n' ' ')"
      - name: Container state
        if: always()
        run: |
          mkdir -p out
          { docker compose ps -a; docker stats --no-stream; docker compose logs --no-color --tail 60 gate; } > out/containers-${{ matrix.flow }}-r${{ matrix.rep }}.txt 2>&1 || true
          docker compose down -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capacity-${{ matrix.flow }}-r${{ matrix.rep }}
          path: out

  results:
    name: Aggregate and push results
    needs: level-sweep
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: capacity-*
          path: experiments/capacity
          merge-multiple: true
      - name: Summarise
        run: python3 tools/capacity_report.py experiments/capacity | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push results for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "capacity/${{ github.run_id }}"
          find experiments/capacity/logs -name '*.log' -exec gzip -9 {} + 2>/dev/null || true
          git add -f experiments/capacity
          git commit -m "experiment: capacity results from run ${{ github.run_id }}"
          git push origin "capacity/${{ github.run_id }}"
