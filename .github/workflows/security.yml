# Security checks that need the network or a running app, alongside the security smoke tests
# in the API suite (ci.yml):
#   dependencies - OSV-Scanner over every lockfile and pom (Maven transitive deps resolved),
#                  fails on any known vulnerability not explained in osv-scanner.toml
#   zap-baseline - OWASP ZAP passive scan of the running SUT; fails on any warning not
#                  triaged in .zap/rules.tsv (each IGNORE there carries its reason)
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * 1'   # Mondays 07:47 IST: new advisories appear without code changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Known vulnerabilities in dependencies (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_VERSION: v2.7.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Software bill of materials (every Maven module, transitive dependencies resolved by Maven)
        run: |
          # OSV-Scanner cannot resolve this reactor's own modules from Maven Central, so Maven
          # resolves the graph and OSV-Scanner reads the CycloneDX SBOM.
          ./mvnw -B -ntp -q install -DskipTests -DskipPerf
          ./mvnw -B -ntp -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom.cdx -DincludeTestScope=true
          python3 -c "import json;b=json.load(open('target/bom.cdx.json'));print(len(b['components']),'components in the SBOM')"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/bom.cdx.json
      - name: Install OSV-Scanner (checksum verified)
        run: |
          base="https://github.com/google/osv-scanner/releases/download/$OSV_VERSION"
          curl -fsSLo osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -fsSLo SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' SHA256SUMS | sha256sum -c -
          install -m 755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
          rm osv-scanner_linux_amd64 SHA256SUMS
          osv-scanner --version
      - name: Scan
        run: |
          set -o pipefail
          osv-scanner scan source --config osv-scanner.toml --format markdown \
            -L target/bom.cdx.json -L dashboard/package-lock.json -L sut/gate-ui/package-lock.json \
            2>&1 | tee "$RUNNER_TEMP/osv.md"
      - name: Summary
        if: always()
        run: |
          { echo "### OSV-Scanner $OSV_VERSION"; cat "$RUNNER_TEMP/osv.md" 2>/dev/null || echo "no output"; } >> "$GITHUB_STEP_SUMMARY"
          # One annotation per affected package: version in use, the version fixing every
          # advisory against it, and the advisories.
          python3 .github/scripts/osv_annotations.py "$RUNNER_TEMP/osv.md"
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/osv.md
          lines: '150'

  zap-baseline:
    name: OWASP ZAP baseline scan of the SUT
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GATE_TEST_SUPPORT_KEY: zap-${{ github.run_id }}
      GATE_JWT_SECRET: zap-${{ github.run_id }}-0123456789abcdef0123456789
      GATE_SEED_PASSWORD: zap-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Start the SUT
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee "$RUNNER_TEMP/compose.log"
      - name: ZAP baseline (passive scan of everything the spider reaches)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          cmd_options: -j
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline
      - name: Alerts as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("report_md.md")
          if not p.exists():
              raise SystemExit("no ZAP report")
          text = p.read_text()
          for line in text.splitlines():
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cells) == 3 and cells[2].isdigit() and cells[1] in ("High", "Medium", "Low", "Informational"):
                  print(f"::warning title=ZAP {cells[1]}::{cells[0]} - {cells[2]} instance(s)")
          ids = sorted(set(re.findall(r"pluginId=(\d+)|Plugin Id \| \[?(\d+)", text) and
                           [a or b for a, b in re.findall(r"pluginId=(\d+)|Plugin Id \| \[?(\d+)", text)]))
          print(f"::notice title=ZAP plugin ids::{', '.join(ids)}")
          PY
      - name: Container logs on failure
        if: failure()
        run: |
          docker compose ps -a >> "$RUNNER_TEMP/compose.log" 2>&1 || true
          docker compose logs --no-color --tail 120 >> "$RUNNER_TEMP/compose.log" 2>&1 || true
      - uses: ./.github/actions/log-tail
        if: failure()
        with:
          file: ${{ runner.temp }}/compose.log
          lines: '150'
      - name: Stop
        if: always()
        run: docker compose down -v
