# Publishes offline build inputs (Maven repository, container images, browsers)
# as assets of the "dev-cache" pre-release. Used to run the full build in
# environments where Maven Central, Docker Hub and browser downloads are
# blocked by egress policy. Not part of the product; safe to delete.
name: dev-cache

on:
  workflow_dispatch:
    inputs:
      m2:
        description: Rebuild the Maven repository archive
        type: boolean
        default: true
      images:
        description: Re-export container images
        type: boolean
        default: false
      browsers:
        description: Re-export browsers and drivers
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MVN: mvn -B -ntp -Dui.node=system -Dexec.skip=true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure release exists
        run: |
          gh release view dev-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create dev-cache --prerelease --title "dev-cache (CI-generated build inputs, not a product release)" \
            --notes "Offline build inputs generated by dev-cache.yml." -R "$GITHUB_REPOSITORY"

      - name: Resolve Maven dependencies and plugins
        if: inputs.m2
        run: |
          set -o pipefail
          exec > >(tee -a "$RUNNER_TEMP/m2.log") 2>&1
          $MVN -DskipTests install
          $MVN dependency:go-offline -DexcludeGroupIds=io.github.raktimchandra.testharness || true
          $MVN verify -DskipTests=false -Dsurefire.failIfNoSpecifiedTests=false || true
          for a in \
            org.apache.maven.surefire:surefire-junit-platform:3.5.4 \
            org.apache.maven.surefire:surefire-junit-platform:3.5.4:jar \
            org.junit.platform:junit-platform-launcher:1.14.4 \
            org.aspectj:aspectjweaver:1.9.25 \
            org.jacoco:org.jacoco.agent:0.8.15:jar:runtime \
            org.jacoco:org.jacoco.cli:0.8.15:jar:nodeps \
            io.qameta.allure:allure-commandline:2.46.1:zip \
            org.springframework.boot:spring-boot-maven-plugin:3.5.16 \
            com.github.eirslett:frontend-maven-plugin:1.15.4 \
            org.codehaus.mojo:exec-maven-plugin:3.6.2 \
            io.qameta.allure:allure-maven:2.17.0 \
            org.jacoco:jacoco-maven-plugin:0.8.15 ; do
            $MVN dependency:get -Dartifact="$a" -Dtransitive=true || echo "WARN could not resolve $a"
          done
          rm -rf ~/.m2/repository/io/github/raktimchandra
          tar czf m2-repository.tgz -C ~/.m2 repository
          ls -lh m2-repository.tgz
          gh release upload dev-cache m2-repository.tgz --clobber -R "$GITHUB_REPOSITORY"

      - name: Export container images
        if: inputs.images
        run: |
          docker pull postgres:16-alpine
          docker save postgres:16-alpine | gzip > images-postgres.tgz
          ls -lh images-*.tgz
          gh release upload dev-cache images-postgres.tgz --clobber -R "$GITHUB_REPOSITORY"

      - name: Export browsers and drivers
        if: inputs.browsers
        run: |
          set -x
          mkdir -p br/drivers
          cp "$(readlink -f "$(which chromedriver)")" br/drivers/
          cp "$(readlink -f "$(which geckodriver)")" br/drivers/
          cp "$(readlink -f "$(which msedgedriver)")" br/drivers/ || true
          CH=$(dirname "$(readlink -f "$(which google-chrome)")")
          FF=$(dirname "$(readlink -f "$(which firefox)")")
          echo "chrome=$CH firefox=$FF"
          tar czf browsers-chrome.tgz -C "$(dirname "$CH")" "$(basename "$CH")" -C "$GITHUB_WORKSPACE/br" drivers
          tar czf browsers-firefox.tgz -C "$(dirname "$FF")" "$(basename "$FF")"
          printf 'chrome_dir=%s\nfirefox_dir=%s\n' "$CH" "$FF" > browsers.txt
          google-chrome --version >> browsers.txt; firefox --version >> browsers.txt
          ls -lh browsers-*.tgz
          gh release upload dev-cache browsers-chrome.tgz browsers-firefox.tgz browsers.txt --clobber -R "$GITHUB_REPOSITORY"

      - name: Summarise failure
        if: failure()
        uses: ./.github/actions/log-tail
        with:
          file: ${{ runner.temp }}/m2.log
