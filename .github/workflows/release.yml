# Publishes a GitHub release from main: tag, notes from CHANGELOG.md, and assets that are
# useful without building anything - the source archive, the SBOM, the quality dashboard and
# the Allure report of a full pipeline run on that commit.
#
# Run it after the pipeline on main is green: Actions -> release -> Run workflow, version e.g. 1.1.0.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (must have a "## [version]" section in CHANGELOG.md)
        required: true
      ci_run:
        description: ID of the green ci.yml run on this commit whose reports to attach (optional)
        required: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Only from main, only once, only with release notes
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::release from main only (got $GITHUB_REF)"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "::error::tag v$VERSION exists"; exit 1; }
          python3 - <<'PY'
          import os, re, sys
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"::error::no '## [{v}]' section in CHANGELOG.md")
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - name: Assets - source archive and SBOM
        run: |
          mkdir -p dist
          git archive --format=zip --prefix="TestHarness-$VERSION/" -o "dist/TestHarness-$VERSION-source.zip" HEAD
          ./mvnw -B -ntp -q install -DskipTests
          ./mvnw -B -ntp -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom.cdx -DincludeTestScope=true
          cp target/bom.cdx.json "dist/TestHarness-$VERSION-sbom.cdx.json"
      - name: Assets - dashboard and Allure report from the pipeline run
        if: inputs.ci_run != ''
        run: |
          gh run download "${{ inputs.ci_run }}" -n allure-report -D allure-report || echo "::warning::no allure-report artifact"
          [ -d allure-report ] && (cd allure-report && zip -qr "../dist/TestHarness-$VERSION-allure-report.zip" .)
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch -q origin gh-pages && git archive --format=zip -o "dist/TestHarness-$VERSION-site.zip" FETCH_HEAD
          fi
          ls -l dist
      - name: Tag and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "TestHarness $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" dist/* --title "TestHarness $VERSION" --notes-file release-notes.md --verify-tag
          echo "Released v$VERSION: $(gh release view "v$VERSION" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
