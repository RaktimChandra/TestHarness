# Toolchain probe: reports the latest released versions of every dependency
# the project uses, the runner's browser/Docker versions, and generates the
# Maven Wrapper scripts. Run manually; outputs are attached to the
# "toolchain-probe" pre-release so they can be inspected offline.
name: bootstrap-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Latest artifact versions from Maven Central
        run: |
          set -u
          arts="
          org.springframework.boot:spring-boot-dependencies
          org.seleniumhq.selenium:selenium-java
          io.rest-assured:rest-assured
          io.cucumber:cucumber-bom
          org.junit:junit-bom
          org.assertj:assertj-core
          org.testcontainers:testcontainers-bom
          io.qameta.allure:allure-bom
          io.qameta.allure:allure-maven
          io.qameta.allure:allure-commandline
          com.deque.html.axe-core:selenium
          au.com.dius.pact.consumer:junit5
          au.com.dius.pact.provider:junit5spring
          io.gatling.highcharts:gatling-charts-highcharts
          io.gatling:gatling-maven-plugin
          org.jacoco:jacoco-maven-plugin
          org.pitest:pitest-maven
          org.pitest:pitest-junit5-plugin
          com.tngtech.archunit:archunit-junit5
          net.datafaker:datafaker
          net.logstash.logback:logstash-logback-encoder
          info.picocli:picocli
          com.networknt:json-schema-validator
          org.apache.maven.plugins:maven-surefire-plugin
          org.apache.maven.plugins:maven-failsafe-plugin
          org.apache.maven.plugins:maven-compiler-plugin
          org.apache.maven.plugins:maven-wrapper-plugin
          org.apache.maven.plugins:maven-enforcer-plugin
          com.github.eirslett:frontend-maven-plugin
          org.codehaus.mojo:exec-maven-plugin
          com.diffplug.spotless:spotless-maven-plugin
          org.aspectj:aspectjweaver
          org.postgresql:postgresql
          org.flywaydb:flyway-core
          org.springdoc:springdoc-openapi-starter-webmvc-ui
          io.cucumber:cucumber-java
          io.qameta.allure:allure-junit5
          org.testcontainers:postgresql
          org.testcontainers:testcontainers-postgresql
          com.fasterxml.jackson:jackson-bom
          org.slf4j:slf4j-api
          ch.qos.logback:logback-classic
          com.github.romankh3:image-comparison
          io.github.bonigarcia:webdrivermanager
          org.awaitility:awaitility
          org.mockito:mockito-core
          org.wiremock:wiremock-standalone
          com.nimbusds:nimbus-jose-jwt
          org.apache.maven.plugins:maven-assembly-plugin
          org.apache.maven.plugins:maven-jar-plugin
          "
          for a in $arts; do
            g=${a%%:*}; n=${a##*:}
            p=$(echo "$g" | tr . /)
            m=$(curl -fsS "https://repo.maven.apache.org/maven2/$p/$n/maven-metadata.xml" || true)
            v=$(echo "$m" | grep -oP '(?<=<release>)[^<]+' || echo "?")
            all=$(echo "$m" | grep -oP '(?<=<version>)[^<]+' | grep -viE 'alpha|beta|rc|-m[0-9]|snapshot' | tail -25 | tr '\n' ' ')
            echo "$a=$v | recent stable: $all" | tee -a versions.txt
          done
      - name: Runner tooling
        run: |
          {
            echo "docker: $(docker version --format '{{.Server.Version}} api={{.Server.APIVersion}} minapi={{.Server.MinAPIVersion}}')"
            echo "chrome: $(google-chrome --version || true)"
            echo "chromedriver: $(chromedriver --version || true)"
            echo "firefox: $(firefox --version || true)"
            echo "geckodriver: $(geckodriver --version | head -1 || true)"
            echo "edge: $(microsoft-edge --version || true)"
            echo "msedgedriver: $(msedgedriver --version || true)"
            echo "node: $(node -v)"
            echo "mvn: $(mvn -v | head -1)"
            echo "cpus: $(nproc)  mem: $(free -g | awk '/Mem/{print $2}')G"
          } | tee runner.txt
      - name: Generate Maven Wrapper (only-script)
        run: |
          mkdir wrap && cd wrap
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
          <groupId>x</groupId><artifactId>x</artifactId><version>1</version><packaging>pom</packaging></project>
          POM
          mvn -B -q -N org.apache.maven.plugins:maven-wrapper-plugin:3.3.2:wrapper -Dmaven=3.9.11 -Dtype=only-script
          tar czf ../maven-wrapper.tgz mvnw mvnw.cmd .mvn
      - name: Publish probe outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete toolchain-probe -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create toolchain-probe versions.txt runner.txt maven-wrapper.tgz \
            --prerelease --title "toolchain probe (CI-generated, not a product release)" \
            --notes "Automatically generated by bootstrap-probe.yml." -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
