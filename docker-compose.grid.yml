# Selenium Grid overlay for docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.grid.yml up -d --build --wait
# Browsers run in the node containers and reach the app as http://gate:8080, so run the
# suites with:  HARNESS_ENV=docker  -Dharness.ui.grid-url=http://localhost:4444
#               -Dharness.sut.browser-base-url=http://gate:8080
# GRID_SESSIONS sets how many concurrent sessions each browser node accepts.

x-node: &node
  shm_size: 2gb
  depends_on:
    selenium-hub:
      condition: service_started
  environment: &node-env
    SE_EVENT_BUS_HOST: selenium-hub
    SE_EVENT_BUS_PUBLISH_PORT: "4442"
    SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
    SE_NODE_MAX_SESSIONS: ${GRID_SESSIONS:-4}
    SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    SE_VNC_NO_PASSWORD: "true"
    # The Grid URL a node advertises is what clients use for BiDi/CDP WebSockets, so it must
    # be reachable from the test JVM (the published hub port), not the hub's container IP.
    SE_NODE_GRID_URL: ${GRID_PUBLIC_URL:-http://localhost:4444}

services:
  selenium-hub:
    image: selenium/hub:4.51.0-20261010
    ports:
      - "127.0.0.1:4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4444/status | grep -q '\"ready\": *true'"]
      interval: 3s
      timeout: 3s
      retries: 40

  chrome:
    <<: *node
    image: selenium/node-chrome:4.51.0-20261010

  firefox:
    <<: *node
    image: selenium/node-firefox:4.51.0-20261010

  edge:
    <<: *node
    image: selenium/node-edge:4.51.0-20261010
