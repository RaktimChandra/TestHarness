# Path templates contain braces, so they are quoted in YAML flow mappings.
rules:
  - {method: GET,  path: "/things/{id}", status: "200", schema: thing.json}
  - {method: POST, path: "/things",      status: "201", schema: thing.json}
  - {method: GET,  path: "/things/{id}", status: 4xx,   schema: problem.json}
  - {method: GET,  path: "/things/{id}", status: "404", schema: problem.json}
